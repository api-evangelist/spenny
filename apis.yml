description: Spenny is an Indian personal-finance and micro-investing app that works like a digital
  piggy bank, rounding up everyday spending on cards, UPI, and netbanking and automatically investing
  the spare change. Users can put round-ups and lump sums (from as little as Rs. 10) into digital gold
  and curated mutual fund baskets, with no lock-ins and anytime withdrawals. Spenny is a consumer mobile
  application and does not currently publish a public developer API, documentation, or developer portal.
  Backed by 500 Global.
